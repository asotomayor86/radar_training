<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{if(localStorage.getItem('theme')==='light')document.documentElement.classList.add('light')}catch(e){}</script>
<title>Radar F/A-18C - MDG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Las fuentes se cargan SIN bloquear: si Google Fonts tarda o falla, la página funciona igual con fuentes del sistema -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap"></noscript>
<link rel="stylesheet" href="css/style.css?v=20261002c">
</head>
<body>
<header class="topbar">
  <a class="brand" id="brand" href="https://hangar.escuadronmaddog.com/"><span class="mad">MAD</span><span class="dog">DOG</span></a>
  <span class="kicker" id="kicker"></span>
  <h1 class="tool" id="h-title"></h1>
  <nav class="topnav">
    <a class="btn" id="back" href="https://hangar.escuadronmaddog.com/"></a>
    <button class="btn" id="theme-toggle" type="button"></button>
    <button class="btn" id="fullscreen" type="button"></button>
  </nav>
</header>

<main class="app">
  <div id="course-view" hidden></div>
  <section class="sim">
    <div id="ddi-root"></div>
    <p id="status" class="status"></p>
    <div class="scn" id="row-ex">
      <button id="restart" type="button"></button>
      <select id="scenario"></select>
      <button id="awacs" type="button" aria-pressed="true"></button>
    </div>
    <div class="scn" id="row-course" hidden>
      <select id="session"></select>
      <button id="open-session" type="button"></button>
    </div>
  </section>

  <aside class="panel">
    <details class="card fold" id="keys-card">
      <summary><h2 id="t-keys"></h2></summary>
      <dl id="keys" class="keys"></dl>
    </details>

    <div class="card" id="map-card">
      <canvas id="map"></canvas>
    </div>

  </aside>
</main>
<div id="tip" role="tooltip"></div>
<script src="js/config.js?v=20261002c"></script>
<script src="js/i18n.js?v=20261002c"></script>
<script src="js/sim.js?v=20261002c"></script>
<script src="js/ui.js?v=20261002c"></script>
<script src="js/map.js?v=20261002c"></script>
<script src="js/course_figs.js?v=20261002c"></script>
<script src="js/course_data.js?v=20261002c"></script>
<script src="js/course.js?v=20261002c"></script>
<script src="js/main.js?v=20261002c"></script>
</body>
</html>
